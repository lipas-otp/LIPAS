[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lipas"
dynamic = ["version"]
description = "LIPAS — a trustworthy local task agent with durable execution, approvals, verification, and staged delivery."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"

dependencies = [
    # lipas core has no mandatory runtime dependencies.
    # Adapter dependencies are optional (see [project.optional-dependencies]).
]

# Used by PyPI search — pick terms people actually search for.
keywords = [
    "llm", "agent", "local-agent", "task-agent", "audit", "replay",
    "side-effects", "budget", "react", "tool-use",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
ollama = [
    "httpx>=0.27",
]
cli = ["prompt-toolkit>=3.0"]
openai = [ "httpx>=0.27" ]
# anthropic = [ "anthropic>=0.28", ]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",        # needed by OllamaAdapter in tests
]
all = ["httpx>=0.27", "prompt-toolkit>=3.0"]

[project.urls]
Homepage   = "https://github.com/lipas-otp/lipas"
Repository = "https://github.com/lipas-otp/lipas"
Changelog  = "https://github.com/lipas-otp/lipas/blob/main/CHANGELOG.md"
Issues     = "https://github.com/lipas-otp/lipas/issues"

[project.scripts]
lipas = "lipas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lipas"]

[tool.hatch.version]
path = "lipas/_version.py"

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]
filterwarnings = [
    "ignore::pytest.PytestWarning:_pytest",
    "ignore::lipas.replay_tools.LipasDangerousReplayWarning",
]
